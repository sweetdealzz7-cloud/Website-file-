<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05070B"/>
      <stop offset="50%" stop-color="#0B0F19"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D4AF37"/>
      <stop offset="50%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#AA7C11"/>
    </linearGradient>
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0.2"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="0.5" stroke-opacity="0.5"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1500" height="600" fill="url(#bg-grad)"/>
  <rect width="1500" height="600" fill="url(#grid)"/>

  <!-- Glowing Geometric Rings (The Circle Engine) -->
  <circle cx="1200" cy="300" r="220" fill="none" stroke="url(#gold-grad)" stroke-width="1.5" stroke-opacity="0.3" stroke-dasharray="10 15"/>
  <circle cx="1200" cy="300" r="180" fill="none" stroke="#06B6D4" stroke-width="2" stroke-opacity="0.4"/>
  <circle cx="1200" cy="300" r="140" fill="none" stroke="url(#gold-grad)" stroke-width="3"/>
  <circle cx="1200" cy="300" r="8" fill="#10B981"/>

  <!-- Orbital Data Nodes -->
  <circle cx="1060" cy="300" r="5" fill="#FFD700"/>
  <circle cx="1200" cy="160" r="5" fill="#06B6D4"/>
  <circle cx="1340" cy="300" r="5" fill="#10B981"/>

  <!-- Status Badge -->
  <rect x="100" y="140" width="220" height="34" rx="17" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <circle cx="120" cy="157" r="4" fill="#10B981"/>
  <text x="135" y="162" font-family="'Inter', system-ui, sans-serif" font-size="12" font-weight="700" fill="#10B981" letter-spacing="1.5">ENTERPRISE OS // LIVE</text>

  <!-- Main Title -->
  <text x="100" y="240" font-family="'Inter', system-ui, sans-serif" font-size="52" font-weight="900" fill="#FFFFFF" letter-spacing="-1">PRT CIRCLE <tspan fill="url(#gold-grad)">//</tspan></text>
  <text x="100" y="310" font-family="'Inter', system-ui, sans-serif" font-size="44" font-weight="800" fill="url(#gold-grad)" letter-spacing="1">REVENUE RECOVERY ENGINE™</text>

  <!-- Version Pill -->
  <rect x="830" y="272" width="85" height="32" rx="6" fill="#D4AF37" fill-opacity="0.2" stroke="#D4AF37" stroke-width="1"/>
  <text x="847" y="293" font-family="'Inter', system-ui, sans-serif" font-size="14" font-weight="800" fill="#FFD700">v3.2</text>

  <!-- Divider Line -->
  <line x1="100" y1="360" x2="900" y2="360" stroke="#334155" stroke-width="1"/>

  <!-- Sub-Features Footer -->
  <text x="100" y="410" font-family="'Inter', system-ui, sans-serif" font-size="14" font-weight="600" fill="#94A3B8" letter-spacing="1">
    <tspan fill="#10B981">●</tspan> SPEED-TO-LEAD &lt; 4s   
    <tspan fill="#334155" dx="20">|</tspan> <tspan fill="#06B6D4" dx="20">●</tspan> APOLLO ENRICHMENT   
    <tspan fill="#334155" dx="20">|</tspan> <tspan fill="#FFD700" dx="20">●</tspan> META WHATSAPP INFRASTRUCTURE
  </text>
</svg>
